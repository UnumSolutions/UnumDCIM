name: Foundation contracts
on: [push, pull_request]
permissions: {contents: read}

# Superseded PR revisions can stop; preserve evidence for every pushed revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p .data/ci
      - run: python scripts/check_boundaries.py
      - run: python scripts/write_openapi.py --check
      - run: python -m pytest -q --junitxml=.data/ci/backend.xml 2>&1 | tee .data/ci/backend.log
      - name: Check migration drift
        run: |
          for service in inventory placement workflow synchronization registry; do
            UNUM_DEMO=1 UNUM_SERVICE=$service python manage.py makemigrations --check --dry-run
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-evidence
          path: .data/ci/backend.*
          include-hidden-files: true
          retention-days: 14

  twin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: {working-directory: web, shell: bash}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: mkdir -p ../.data/ci
      - run: npm run test -- --reporter=default --reporter=junit --outputFile=../.data/ci/frontend.xml 2>&1 | tee ../.data/ci/frontend-test.log
      - run: npm run build 2>&1 | tee ../.data/ci/frontend-build.log
      - run: npm audit --include=dev --audit-level=high 2>&1 | tee ../.data/ci/frontend-audit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-evidence
          path: .data/ci/frontend*
          include-hidden-files: true
          retention-days: 14

  postgres-and-jetstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p .data/qualification
      # Keep the full suite under real services as well as the SQLite baseline.
      - run: python scripts/qualify.py --junitxml=.data/qualification/tests.xml 2>&1 | tee .data/qualification/tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrastructure-qualification
          path: |
            .data/qualification/latest.json
            .data/qualification/tests.xml
            .data/qualification/tests.log
          include-hidden-files: true
          retention-days: 14

  browser-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p .data/ci/gateway
      - run: docker build --progress=plain -f deploy/web/Dockerfile -t unum-web:qualification . 2>&1 | tee .data/ci/gateway/build.log
      - run: python deploy/web/smoke.py 2>&1 | tee .data/ci/gateway/smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-gateway-evidence
          path: .data/ci/gateway/
          include-hidden-files: true
          retention-days: 14

  workspace-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p .data/ci/identity
      - run: python deploy/identity/qualify.py | tee .data/ci/identity/qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workspace-identity-evidence
          path: .data/ci/identity/
          include-hidden-files: true
          retention-days: 14

  module-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: mkdir -p .data/ci/images
      # Reuse dependency layers within one builder; this gate never pushes images.
      - name: Build all module images
        run: |
          failed=0
          for module in inventory placement workflow synchronization registry; do
            docker build --progress=plain --build-arg MODULE="$module" \
              -t "unum-$module:qualification" . 2>&1 | tee ".data/ci/images/$module-build.log" || failed=1
          done
          exit "$failed"
      - name: Smoke all module images
        run: python deploy/smoke_images.py --report .data/ci/images/smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: module-image-evidence
          path: .data/ci/images/
          include-hidden-files: true
          retention-days: 14

  deployment-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: deploy/requirements-ci.txt}
      - run: python -m pip install -r deploy/requirements-ci.txt
      - name: Install checksum-verified Helm in the runner temporary directory
        run: python scripts/install_ci_helm.py --output-dir "$RUNNER_TEMP/unum-helm"
      - name: Lint and render all modules; reject unsafe values
        run: python scripts/check_helm.py --helm "$RUNNER_TEMP/unum-helm/helm"
      - name: Validate Ansible syntax and lint without contacting hosts
        run: python scripts/check_ansible.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployment-template-evidence
          path: .data/ci/deployment/
          include-hidden-files: true
          retention-days: 14

  ci:
    name: CI required checks
    if: always()
    needs: [backend, twin, postgres-and-jetstream, browser-gateway, workspace-identity, module-images, deployment-templates]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if any(job["result"] != "success" for job in results.values()):
              raise SystemExit("All validation jobs must succeed (including no skipped jobs).")
          PY
