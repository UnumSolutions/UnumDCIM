name: Foundation contracts
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/check_boundaries.py
      - run: python scripts/write_openapi.py --check
      - run: python -m pytest -q
      - name: Check migration drift
        run: |
          for service in inventory placement workflow synchronization registry; do
            UNUM_DEMO=1 UNUM_SERVICE=$service python manage.py makemigrations --check --dry-run
          done
  twin:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres-and-jetstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-qualification
          path: .data/qualification/latest.json
